; ============================================================
;  Vastior.ini  -  camera zoom settings for Grim Dawn
;  Edit values, save, then fully close and relaunch Grim Dawn.
;  All values are range-checked by Vastior; out-of-range numbers are clamped.
;
;  CameraMinimumZoomDistance  zoom-IN  limit (how close). 3..500. Lower = closer.
;  CameraMaximumZoomDistance  zoom-OUT limit (how far). (minimum+1)..500.
;  CameraFarClipDistance      draw distance. maximum..2000.
;  CameraDepthFogClamp        0 or 1 (leave 0).
;  CameraTiltZoomThreshold    when zoom distance <= this, the camera tilts. 0..maximum.
;  CameraTiltAngleDegrees     tilt amount. 0 = OFF. -45..45 (negative = down).
;  CameraTiltSmoothing        tilt ease speed. 0.001..1.0 (smaller = slower).
; ============================================================
[Settings]
CameraMinimumZoomDistance = 7
CameraMaximumZoomDistance = 60
CameraFarClipDistance = 250
CameraDepthFogClamp = 0
CameraTiltZoomThreshold = 7
CameraTiltAngleDegrees = 0
CameraTiltSmoothing = 0.02
